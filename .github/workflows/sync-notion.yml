name: Sync Notion

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-notion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-notion.check.mjs
      - run: node scripts/sync-notion.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - name: Commit data.json if changed
        run: |
          # generatedAt changes every run; only commit when the real data changed
          if git diff --quiet -I '"generatedAt"' -- data.json; then
            echo "No data change"; exit 0
          fi
          git config user.name "notion-sync"
          git config user.email "notion-sync@users.noreply.github.com"
          git add data.json
          git commit -m "chore: sync data.json from Notion"
          git push
